<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expression orale — L'Académie 2</title>
    <link rel="icon" type="image/x-icon" href="../academie/academie.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans:['Montserrat','sans-serif'], serif:['Merriweather','serif'] },
                    colors: {
                        frBlue:  '#002654',
                        frRed:   '#ED2939',
                        frCream: '#F5F5DC',
                        gold:    '#D4AF37',
                        coral:   '#FF6B6B',
                        teal:    '#4ECDC4',
                    },
                    boxShadow: { card:'0 10px 15px -3px rgba(0,0,0,.1)' }
                }
            }
        }
    </script>

    <style>
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; font-family:'Montserrat',sans-serif; }
        input, textarea { font-size: 16px !important; }

        .stat-card { background:white; border-radius:1rem; padding:1rem; box-shadow:0 2px 8px rgba(0,0,0,.07); border:1px solid #f1f1f1; }

        /* Chrono */
        .chrono-display { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
        .chrono-btn {
            display:flex; align-items:center; justify-content:center; gap:.5rem;
            border-radius:1rem; font-weight:700; font-size:.8rem;
            padding:.9rem 1rem; transition:transform .12s, opacity .12s;
            border-bottom:4px solid rgba(0,0,0,.22);
        }
        .chrono-btn:active:not(:disabled) { transform:translateY(2px); border-bottom-width:2px; }
        .chrono-btn:disabled { opacity:.35; }
        @keyframes chronoPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
        .chrono-running .chrono-dot { animation: chronoPulse 1.2s infinite; }

        /* Sliders */
        input[type=range].lvl {
            -webkit-appearance:none; appearance:none;
            width:100%; height:8px; border-radius:99px; background:#e5e7eb; outline:none;
        }
        input[type=range].lvl::-webkit-slider-thumb {
            -webkit-appearance:none; appearance:none;
            width:26px; height:26px; border-radius:50%;
            background:#002654; border:3px solid #fff;
            box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer;
        }
        input[type=range].lvl::-moz-range-thumb {
            width:26px; height:26px; border-radius:50%;
            background:#002654; border:3px solid #fff;
            box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer; border-color:#fff;
        }

        @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .animate-slide-in { animation: slideIn .3s ease-out forwards; }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 h-[100dvh] flex flex-col overflow-hidden">

<!-- ═══════════════════════════════════════════════════════════════
     NAVBAR
═══════════════════════════════════════════════════════════════ -->
<nav class="bg-frBlue text-white shadow-lg z-50 shrink-0">
    <div class="max-w-4xl mx-auto px-4 h-14 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="index.html"
               class="bg-white/10 active:bg-white/20 text-white w-9 h-9 rounded-lg flex items-center justify-center transition">
                <i class="fa-solid fa-arrow-left text-gold text-sm"></i>
            </a>
            <h1 class="font-bold text-sm tracking-wider uppercase flex items-center gap-2">
                <i class="fa-solid fa-microphone-lines text-gold"></i> Expression orale
            </h1>
        </div>
        <div class="flex items-center gap-1.5 bg-white/10 px-3 py-1 rounded-full border border-white/10">
            <i class="fa-solid fa-chart-simple text-teal text-xs"></i>
            <span id="nav-count" class="text-xs font-bold font-mono">0</span>
        </div>
    </div>
    <div class="h-1 w-full flex">
        <div class="w-1/3 bg-blue-600"></div>
        <div class="w-1/3 bg-white"></div>
        <div class="w-1/3 bg-red-600"></div>
    </div>
</nav>

<!-- ═══════════════════════════════════════════════════════════════
     CONTENU
═══════════════════════════════════════════════════════════════ -->
<main class="flex-1 overflow-y-auto bg-frCream">
<div class="max-w-4xl mx-auto px-4 py-6 flex flex-col gap-8 pb-16">

    <!-- ── SESSION ──────────────────────────────────────────── -->
    <section>
        <h2 class="text-xs font-bold uppercase tracking-widest text-frBlue mb-4">
            <i class="fa-solid fa-comments mr-1 text-gold"></i> Nouvelle session
        </h2>

        <div class="bg-white rounded-2xl shadow-card border border-gray-100 p-5 flex flex-col gap-5">

            <!-- Sujet -->
            <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold uppercase tracking-wider text-gray-500">Sujet de l'expression</span>
                <input type="text" id="subject-input" placeholder="Ex. : Les vacances d'été, le télétravail…"
                       class="px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-frBlue">
            </label>

            <!-- Chrono -->
            <div id="chrono-box" class="rounded-2xl bg-frBlue text-white py-6 px-4 flex flex-col items-center gap-1">
                <div class="flex items-center gap-2">
                    <span class="chrono-dot w-2 h-2 rounded-full bg-teal" id="chrono-dot" style="opacity:.3;"></span>
                    <span id="chrono-state" class="text-[10px] uppercase tracking-widest font-bold text-white/60">Prêt</span>
                </div>
                <div id="chrono-display" class="chrono-display text-5xl sm:text-6xl font-bold">00:00</div>
            </div>

            <!-- Contrôles -->
            <div class="grid grid-cols-3 gap-2">
                <button id="btn-play" onclick="oral.play()" class="chrono-btn bg-green-500 text-white">
                    <i class="fa-solid fa-play"></i> <span id="btn-play-label">Démarrer</span>
                </button>
                <button id="btn-pause" onclick="oral.pause()" disabled class="chrono-btn bg-amber-400 text-white">
                    <i class="fa-solid fa-pause"></i> Pause
                </button>
                <button id="btn-finish" onclick="oral.finish()" disabled class="chrono-btn bg-frRed text-white">
                    <i class="fa-solid fa-flag-checkered"></i> Terminer
                </button>
            </div>
        </div>
    </section>

    <!-- ── ÉVALUATION ───────────────────────────────────────── -->
    <section id="eval-section" class="hidden animate-slide-in">
        <h2 class="text-xs font-bold uppercase tracking-widest text-frBlue mb-4">
            <i class="fa-solid fa-star-half-stroke mr-1 text-gold"></i> Évaluation
        </h2>

        <div class="bg-white rounded-2xl shadow-card border border-gray-100 p-5 flex flex-col gap-6">

            <div class="flex items-center justify-between bg-frCream rounded-xl px-4 py-3">
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">Durée</span>
                    <span id="eval-duration" class="text-lg font-bold text-frBlue chrono-display">00:00</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">Score</span>
                    <span id="eval-score" class="text-lg font-bold text-gold">9 / 12</span>
                </div>
            </div>

            <div id="sliders" class="flex flex-col gap-6"></div>

            <div class="flex flex-col gap-2">
                <button onclick="oral.save()"
                        class="w-full bg-frBlue text-white font-bold py-3.5 rounded-xl text-sm transition hover:bg-blue-900 active:translate-y-0.5">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer la session
                </button>
                <button onclick="oral.cancel()"
                        class="w-full text-gray-400 hover:text-gray-600 font-bold py-2 rounded-xl text-xs transition">
                    Annuler
                </button>
            </div>
        </div>
    </section>

    <!-- ── ÉVOLUTION ────────────────────────────────────────── -->
    <section>
        <h2 class="text-xs font-bold uppercase tracking-widest text-frBlue mb-4">
            <i class="fa-solid fa-chart-line mr-1 text-gold"></i> Évolution de la note
        </h2>

        <div class="stat-card">
            <div class="flex flex-wrap items-center gap-3 mb-3">
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-gray-500">
                    <span class="w-3 h-1 rounded-full" style="background:#002654"></span> Total /12
                </span>
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-gray-500">
                    <span class="w-3 h-1 rounded-full" style="background:#FF6B6B"></span> Attitude
                </span>
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-gray-500">
                    <span class="w-3 h-1 rounded-full" style="background:#4ECDC4"></span> Résilience
                </span>
                <span class="flex items-center gap-1.5 text-[10px] font-bold text-gray-500">
                    <span class="w-3 h-1 rounded-full" style="background:#D4AF37"></span> Fluidité
                </span>
            </div>
            <canvas id="chart-oral" height="150"></canvas>
            <p id="chart-empty" class="hidden text-xs text-gray-400 text-center py-6">
                Aucune session enregistrée pour l'instant.
            </p>
        </div>
    </section>

    <!-- ── HISTORIQUE ───────────────────────────────────────── -->
    <section>
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xs font-bold uppercase tracking-widest text-frBlue">
                <i class="fa-solid fa-clock-rotate-left mr-1 text-gold"></i> Historique
            </h2>
            <span id="history-count" class="text-xs text-gray-400"></span>
        </div>

        <div class="bg-white rounded-2xl shadow-card border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-frBlue/5">
                        <tr class="text-[10px] uppercase tracking-wider text-frBlue font-bold">
                            <th class="text-left  px-4 py-3">Date</th>
                            <th class="text-left  px-4 py-3">Sujet</th>
                            <th class="text-center px-3 py-3">Durée</th>
                            <th class="text-center px-2 py-3" title="Attitude">Att.</th>
                            <th class="text-center px-2 py-3" title="Résilience">Rés.</th>
                            <th class="text-center px-2 py-3" title="Fluidité">Flu.</th>
                            <th class="text-center px-3 py-3">Total</th>
                            <th class="px-2 py-3"></th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </section>

</div>
</main>

<script>
const oral = {

    STORE: 'acad2_oral',

    CRITERIA: [
        {
            key: 'attitude',
            label: 'Attitude',
            color: '#FF6B6B',
            desc: "La personne s'est efforcé de maintenir la conversation sans blanc, en improvisant et en s'intéressant à son interlocuteur"
        },
        {
            key: 'resilience',
            label: 'Résilience',
            color: '#4ECDC4',
            desc: "La personne a tenu compte des erreurs de prononciation et du vocabulaire utilisé par son interlocuteur natif"
        },
        {
            key: 'fluidite',
            label: 'Fluidité',
            color: '#D4AF37',
            desc: "La personne parle à un rythme naturel et comprend son interlocuteur directement"
        }
    ],

    LEVELS: ['Insuffisant', 'En progrès', 'Bien', 'Excellent'],

    // Chrono state
    elapsedMs: 0,
    startedAt: null,
    ticker:    null,
    chart:     null,

    get sessions() {
        try { return JSON.parse(localStorage.getItem(this.STORE) || '[]'); }
        catch { return []; }
    },
    setSessions(list) { localStorage.setItem(this.STORE, JSON.stringify(list)); },

    // ════════════════════════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════════════════════════
    init() {
        this.renderSliders();
        this.renderChart();
        this.renderHistory();
    },

    // ════════════════════════════════════════════════════════════
    //  CHRONO
    // ════════════════════════════════════════════════════════════
    get isRunning() { return this.startedAt !== null; },

    currentMs() {
        return this.elapsedMs + (this.isRunning ? Date.now() - this.startedAt : 0);
    },

    fmt(ms) {
        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const pad = n => String(n).padStart(2, '0');
        return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    },

    tick() {
        document.getElementById('chrono-display').textContent = this.fmt(this.currentMs());
    },

    play() {
        if (this.isRunning) return;
        this.startedAt = Date.now();
        this.ticker    = setInterval(() => this.tick(), 200);
        this.tick();
        this.setChronoUI('running');
    },

    pause() {
        if (!this.isRunning) return;
        this.elapsedMs += Date.now() - this.startedAt;
        this.startedAt  = null;
        clearInterval(this.ticker);
        this.ticker = null;
        this.tick();
        this.setChronoUI('paused');
    },

    finish() {
        if (this.isRunning) this.pause();
        if (this.currentMs() === 0) return;
        this.setChronoUI('finished');

        document.getElementById('eval-duration').textContent = this.fmt(this.currentMs());
        this.CRITERIA.forEach(c => {
            const input = document.getElementById(`slider-${c.key}`);
            input.value = 3;
            this.onSlide(c.key);
        });
        this.updateScore();

        const sec = document.getElementById('eval-section');
        sec.classList.remove('hidden');
        setTimeout(() => sec.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
    },

    reset() {
        clearInterval(this.ticker);
        this.ticker    = null;
        this.startedAt = null;
        this.elapsedMs = 0;
        document.getElementById('chrono-display').textContent = '00:00';
        document.getElementById('subject-input').value = '';
        document.getElementById('eval-section').classList.add('hidden');
        this.setChronoUI('idle');
    },

    setChronoUI(state) {
        const box    = document.getElementById('chrono-box');
        const dot    = document.getElementById('chrono-dot');
        const label  = document.getElementById('chrono-state');
        const play   = document.getElementById('btn-play');
        const pause  = document.getElementById('btn-pause');
        const finish = document.getElementById('btn-finish');
        const playLb = document.getElementById('btn-play-label');

        box.classList.toggle('chrono-running', state === 'running');
        dot.style.opacity = state === 'running' ? '1' : '.3';

        if (state === 'running') {
            label.textContent = 'En cours';
            play.disabled = true; pause.disabled = false; finish.disabled = false;
            playLb.textContent = 'Reprendre';
        } else if (state === 'paused') {
            label.textContent = 'En pause';
            play.disabled = false; pause.disabled = true; finish.disabled = false;
            playLb.textContent = 'Reprendre';
        } else if (state === 'finished') {
            label.textContent = 'Terminé';
            play.disabled = true; pause.disabled = true; finish.disabled = true;
        } else {
            label.textContent = 'Prêt';
            play.disabled = false; pause.disabled = true; finish.disabled = true;
            playLb.textContent = 'Démarrer';
        }
    },

    // ════════════════════════════════════════════════════════════
    //  SLIDERS
    // ════════════════════════════════════════════════════════════
    renderSliders() {
        document.getElementById('sliders').innerHTML = this.CRITERIA.map(c => `
            <div class="flex flex-col gap-2">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex flex-col gap-1 flex-1">
                        <span class="text-sm font-bold" style="color:${c.color};">${c.label}</span>
                        <span class="text-[11px] text-gray-500 leading-snug">${c.desc}</span>
                    </div>
                    <span id="badge-${c.key}"
                          class="shrink-0 text-[10px] font-bold text-white px-2.5 py-1 rounded-full"
                          style="background:${c.color};">3 · Bien</span>
                </div>
                <input type="range" class="lvl" id="slider-${c.key}"
                       min="1" max="4" step="1" value="3"
                       oninput="oral.onSlide('${c.key}')">
                <div class="flex justify-between text-[9px] font-bold uppercase tracking-wider text-gray-400">
                    ${this.LEVELS.map(l => `<span>${l}</span>`).join('')}
                </div>
            </div>`).join('');
        this.CRITERIA.forEach(c => this.onSlide(c.key));
    },

    onSlide(key) {
        const c   = this.CRITERIA.find(x => x.key === key);
        const val = parseInt(document.getElementById(`slider-${key}`).value, 10);
        document.getElementById(`badge-${key}`).textContent = `${val} · ${this.LEVELS[val - 1]}`;
        this.updateScore();
    },

    currentScores() {
        const out = {};
        this.CRITERIA.forEach(c => {
            out[c.key] = parseInt(document.getElementById(`slider-${c.key}`).value, 10) || 1;
        });
        return out;
    },

    updateScore() {
        const s     = this.currentScores();
        const total = this.CRITERIA.reduce((a, c) => a + s[c.key], 0);
        document.getElementById('eval-score').textContent = `${total} / 12`;
    },

    // ════════════════════════════════════════════════════════════
    //  SAUVEGARDE
    // ════════════════════════════════════════════════════════════
    save() {
        const scores  = this.currentScores();
        const subject = document.getElementById('subject-input').value.trim() || 'Sans sujet';

        const list = this.sessions;
        list.push({
            id:         'o' + Date.now(),
            at:         new Date().toISOString(),
            subject,
            durationMs: this.currentMs(),
            ...scores,
            total:      this.CRITERIA.reduce((a, c) => a + scores[c.key], 0)
        });
        this.setSessions(list);

        this.reset();
        this.renderChart();
        this.renderHistory();
    },

    cancel() { this.reset(); },

    remove(id) {
        if (!confirm('Supprimer cette session ?')) return;
        this.setSessions(this.sessions.filter(s => s.id !== id));
        this.renderChart();
        this.renderHistory();
    },

    // ════════════════════════════════════════════════════════════
    //  GRAPHIQUE
    // ════════════════════════════════════════════════════════════
    renderChart() {
        const sessions = this.sessions.slice(-20);
        const canvas   = document.getElementById('chart-oral');
        const empty    = document.getElementById('chart-empty');

        canvas.style.display = sessions.length ? '' : 'none';
        empty.classList.toggle('hidden', sessions.length > 0);
        if (!sessions.length) {
            if (this.chart) { this.chart.destroy(); this.chart = null; }
            return;
        }

        const labels = sessions.map(s => {
            const d = new Date(s.at);
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
        });

        const datasets = [
            {
                label: 'Total /12',
                data: sessions.map(s => s.total),
                borderColor: '#002654', backgroundColor: 'rgba(0,38,84,.08)',
                borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#002654',
                tension: .35, fill: true, yAxisID: 'y'
            },
            ...this.CRITERIA.map(c => ({
                label: c.label,
                data: sessions.map(s => s[c.key]),
                borderColor: c.color, backgroundColor: c.color,
                borderWidth: 2, pointRadius: 2, borderDash: [4, 3],
                tension: .35, fill: false, yAxisID: 'y1'
            }))
        ];

        if (this.chart) this.chart.destroy();
        this.chart = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: (items) => {
                                const s = sessions[items[0].dataIndex];
                                return s ? s.subject : '';
                            },
                            label: c => c.dataset.label === 'Total /12'
                                ? `Total : ${c.parsed.y} / 12`
                                : `${c.dataset.label} : ${c.parsed.y} / 4`
                        }
                    }
                },
                scales: {
                    x:  { ticks:{ font:{size:9}, color:'#9ca3af' }, grid:{ display:false } },
                    y:  { position:'left', min:0, max:12, ticks:{ stepSize:3, font:{size:9}, color:'#9ca3af' }, grid:{ color:'#f3f4f6' } },
                    y1: { position:'right', min:0, max:4, ticks:{ stepSize:1, font:{size:9}, color:'#d1d5db' }, grid:{ display:false } }
                }
            }
        });
    },

    // ════════════════════════════════════════════════════════════
    //  HISTORIQUE
    // ════════════════════════════════════════════════════════════
    renderHistory() {
        const sessions = this.sessions.slice().sort((a, b) => b.at.localeCompare(a.at));
        const body     = document.getElementById('history-body');

        document.getElementById('nav-count').textContent     = sessions.length;
        document.getElementById('history-count').textContent =
            `${sessions.length} session${sessions.length > 1 ? 's' : ''}`;

        if (!sessions.length) {
            body.innerHTML = `
                <tr><td colspan="8" class="text-center text-xs text-gray-400 py-8">
                    Aucune session enregistrée.
                </td></tr>`;
            return;
        }

        body.innerHTML = sessions.map(s => {
            const d       = new Date(s.at);
            const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
            const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const cell = v => `<td class="text-center px-2 py-3 font-bold" style="color:${this._lvlColor(v)};">${v}</td>`;
            return `
                <tr class="border-t border-gray-100">
                    <td class="px-4 py-3 whitespace-nowrap">
                        <div class="text-xs font-bold text-frBlue">${dateStr}</div>
                        <div class="text-[10px] text-gray-400">${timeStr}</div>
                    </td>
                    <td class="px-4 py-3 text-xs text-gray-700 max-w-[180px] truncate" title="${this._esc(s.subject)}">
                        ${this._esc(s.subject)}
                    </td>
                    <td class="text-center px-3 py-3 text-xs font-mono text-gray-500">${this.fmt(s.durationMs || 0)}</td>
                    ${cell(s.attitude)}${cell(s.resilience)}${cell(s.fluidite)}
                    <td class="text-center px-3 py-3">
                        <span class="text-xs font-bold text-white px-2 py-1 rounded-full"
                              style="background:${this._totalColor(s.total)};">${s.total}/12</span>
                    </td>
                    <td class="text-center px-2 py-3">
                        <button onclick="oral.remove('${s.id}')" class="text-gray-300 hover:text-red-500 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </td>
                </tr>`;
        }).join('');
    },

    _lvlColor(v)   { return ['#ef4444', '#f59e0b', '#3b82f6', '#22c55e'][(v || 1) - 1]; },
    _totalColor(t) { return t >= 11 ? '#22c55e' : t >= 8 ? '#3b82f6' : t >= 6 ? '#f59e0b' : '#ef4444'; },

    _esc(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
};

oral.init();

window.addEventListener('pageshow', (event) => {
    if (event.persisted) { oral.renderChart(); oral.renderHistory(); }
});
</script>
</body>
</html>
