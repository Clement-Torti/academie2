<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecture — L'Académie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:      #12111a;
            --surface: #1c1b2a;
            --border:  #252336;
            --text:    #e8dcc8;
            --muted:   #4a4560;
            --accent:  #c9a96e;
            --dimmed:  #2e2b45;
        }
        *, *::before, *::after { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Typographie lecture ───────────────────────────────── */
        .read-body {
            font-family: 'Merriweather', serif;
            font-size: 1.05rem;
            line-height: 1.95;
            color: var(--text);
        }
        .read-body p         { margin-bottom: 1.4em; text-indent: 1.6em; }
        .read-body p.no-ind  { text-indent: 0; }
        .read-body h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: .85rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .16em;
            text-align: center; text-indent: 0;
            color: var(--accent);
            margin: 3em 0 1.2em;
        }
        .read-body h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: .72rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .14em;
            text-align: center; text-indent: 0;
            color: #635e85;
            margin: 2em 0 1em;
        }

        /* ── Contexte session précédente ───────────────────────── */
        .ctx-block { opacity: .55; }

        /* ── Progress bar ──────────────────────────────────────── */
        #prog-fill { transition: width .6s ease; }

        /* ── Scrollbar ─────────────────────────────────────────── */
        ::-webkit-scrollbar              { width: 3px; }
        ::-webkit-scrollbar-track        { background: var(--bg); }
        ::-webkit-scrollbar-thumb        { background: #2a2840; border-radius: 4px; }

        /* ── Animations ────────────────────────────────────────── */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .4s ease; }

        /* ── Surlignage ────────────────────────────────────────── */
        mark.hl {
            background: rgba(201,169,110,.22);
            color: inherit;
            border-radius: 2px;
            padding: 0 1px;
        }
        #hl-bar {
            position: fixed;
            z-index: 200;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,.5);
            background: var(--surface);
            border: 1px solid var(--border);
            transform: translateX(-50%);
            pointer-events: auto;
        }
        #hl-bar button {
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: opacity .15s;
        }
        #hl-bar button:active { opacity: .6; }

        /* ── Cover splash ──────────────────────────────────────── */
        #cover-splash {
            position: fixed;
            inset: 0;
            z-index: 600;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* wrapper that animates — pages + cover move together */
        #cover-scene {
            position: relative;
            z-index: 603;
            width: min(360px, 72vw);
            animation: coverAppear .55s cubic-bezier(.15,.85,.35,1) both;
        }
        #cover-scene.zooming {
            animation: coverZoom .78s cubic-bezier(.4,0,.85,1) forwards;
        }
        /* stacked page layers — offset right/down to fake book thickness */
        .book-page {
            position: absolute;
            inset: 0;
            border-radius: 3px 10px 10px 3px;
        }
        .book-page:nth-child(1) { transform: translate(16px, 7px); background: #c8c2b6; box-shadow: 3px 4px 14px rgba(0,0,0,.35); }
        .book-page:nth-child(2) { transform: translate(10px, 4px); background: #dbd4c8; box-shadow: 2px 3px 10px rgba(0,0,0,.28); }
        .book-page:nth-child(3) { transform: translate(4px,  2px); background: #eee8de; box-shadow: 1px 2px 7px  rgba(0,0,0,.22); }
        /* cover image on top */
        #cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 3px 10px 10px 3px;
            overflow: hidden;
            box-shadow:
                18px 28px 80px rgba(0,0,0,.9),
                -4px 0 0 rgba(0,0,0,.45),
                inset -1px 0 0 rgba(255,255,255,.06);
            z-index: 4;
        }
        /* spine shadow overlay */
        #cover-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right,
                rgba(0,0,0,.45) 0%,
                rgba(0,0,0,.08) 9%,
                transparent 22%);
            pointer-events: none;
            z-index: 1;
        }
        #cover-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        @keyframes coverAppear {
            from { opacity: 0; transform: scale(.82) translateY(14px); }
            to   { opacity: 1; transform: scale(1)   translateY(0); }
        }
        @keyframes coverZoom {
            0%   { transform: scale(1);   }
            28%  { transform: scale(.88); }
            100% { transform: scale(3.5); }
        }
        /* Reader fade-in after cover animation */
        body.reader-in > nav,
        body.reader-in > div.flex-1 {
            animation: readerFadeIn .55s ease both;
        }
        @keyframes readerFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Sparkles / fioriture ───────────────────────────────── */
        .sp {
            position: absolute;
            pointer-events: none;
            z-index: 602;
            opacity: 0;
            animation: spTwinkle var(--spd, 1.2s) ease-in-out var(--dly, 0s) infinite;
        }
        .sp.dot {
            border-radius: 50%;
            background: radial-gradient(circle, #fff 15%, rgba(201,169,110,.85) 55%, transparent 75%);
            box-shadow: 0 0 7px 2px rgba(201,169,110,.55), 0 0 3px 1px rgba(255,255,255,.5);
        }
        .sp.star {
            background: rgba(220,190,130,.95);
            clip-path: polygon(50% 0%,56% 44%,100% 50%,56% 56%,50% 100%,44% 56%,0% 50%,44% 44%);
            filter: drop-shadow(0 0 5px rgba(201,169,110,1)) drop-shadow(0 0 2px rgba(255,255,255,.8));
        }
        @keyframes spTwinkle {
            0%   { opacity: 0;   transform: scale(0)    rotate(0deg);  }
            20%  { opacity: 1;   transform: scale(1)    rotate(18deg); }
            50%  { opacity: .55; transform: scale(.72)  rotate(38deg); }
            80%  { opacity: .9;  transform: scale(1.15) rotate(56deg); }
            100% { opacity: 0;   transform: scale(0)    rotate(72deg); }
        }

        /* ── Ambient reader sparkles (behind all content) ───────── */
        .sp-bg {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: spAmbient var(--spd, 5s) ease-in-out var(--dly, 0s) infinite;
        }
        .sp-bg.dot {
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.7) 15%, rgba(201,169,110,.55) 55%, transparent 75%);
            box-shadow: 0 0 7px 3px rgba(201,169,110,.3);
        }
        .sp-bg.star {
            background: rgba(201,169,110,.8);
            clip-path: polygon(50% 0%,56% 44%,100% 50%,56% 56%,50% 100%,44% 56%,0% 50%,44% 44%);
            filter: drop-shadow(0 0 4px rgba(201,169,110,.65));
        }
        @keyframes spAmbient {
            0%   { opacity: 0;  transform: scale(0)    rotate(0deg);  }
            25%  { opacity: .8; transform: scale(1)    rotate(12deg); }
            55%  { opacity: .5; transform: scale(.82)  rotate(27deg); }
            80%  { opacity: .7; transform: scale(1.05) rotate(42deg); }
            100% { opacity: 0;  transform: scale(0)    rotate(55deg); }
        }

        /* ── Vocab sidebar ─────────────────────────────────────── */
        .vocab-inp {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: .5rem;
            padding: .5rem .6rem;
            width: 100%;
            font-size: 13px !important;
            transition: border-color .2s;
            font-family: 'Montserrat', sans-serif;
        }
        .vocab-inp:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(201,169,110,.12);
        }
        .vocab-inp::placeholder { color: var(--dimmed); font-size: 10px; }
    </style>
</head>

<body class="h-[100dvh] flex flex-col overflow-hidden">

<!-- ═══════════════════════════════════════════════════════════════
     COVER SPLASH
═══════════════════════════════════════════════════════════════ -->
<div id="cover-splash" aria-hidden="true">
    <div id="cover-scene">
        <div class="book-page"></div>
        <div class="book-page"></div>
        <div class="book-page"></div>
        <div id="cover-wrap">
            <img src="cover.png" alt=""
                 onerror="document.getElementById('cover-splash').remove()">
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     NAVBAR
═══════════════════════════════════════════════════════════════ -->
<nav style="background:var(--surface); border-bottom:1px solid var(--border);" class="shrink-0 z-20 select-none">
    <div class="flex items-center h-11 px-4 gap-3">

        <a href="index.html"
           class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide transition-opacity active:opacity-40 shrink-0"
           style="color:var(--muted);">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
            <span class="hidden sm:inline">Accueil</span>
        </a>

        <p id="book-title"
           class="flex-1 text-center text-[11px] font-bold uppercase tracking-widest truncate"
           style="color:var(--accent);">Chargement…</p>

        <span id="prog-label" class="shrink-0 text-[11px] font-mono font-bold" style="color:var(--accent);">0%</span>
    </div>

</nav>

<!-- Barre de surlignage flottante -->
<div id="hl-bar" style="display:none;" onmousedown="event.preventDefault()">
    <button onclick="reader.applyHighlight()"
            style="background:rgba(201,169,110,.25); color:var(--accent);">
        <i class="fa-solid fa-highlighter mr-1"></i>Surligner
    </button>
    <button onclick="reader.sendToVocab()"
            style="background:rgba(99,94,133,.35); color:#a09bbf;">
        <i class="fa-solid fa-bookmark mr-1"></i>Vocab
    </button>
    <button onclick="reader.removeHighlight()"
            style="background:var(--dimmed); color:var(--muted);">
        <i class="fa-solid fa-eraser"></i>
    </button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     CONTENU + SIDEBAR VOCAB
═══════════════════════════════════════════════════════════════ -->
<div class="flex-1 flex overflow-hidden">

    <!-- ── Zone de lecture ──────────────────────────────────── -->
    <main id="reader-main" class="flex-1 overflow-y-auto">
        <div style="max-width:640px; margin:0 auto; padding:2.5rem 1.5rem 3rem;">

            <div id="loader" class="flex flex-col items-center justify-center py-24" style="color:var(--muted);">
                <i class="fa-solid fa-book-open text-4xl mb-4" style="color:var(--dimmed);"></i>
                <p class="text-sm">Ouverture du livre…</p>
            </div>

            <div id="reading-area" class="hidden read-body"></div>

        </div>
    </main>

    <!-- ── Sidebar vocabulaire (collapsable) ───────────────── -->
    <aside id="vocab-side"
           class="shrink-0 flex flex-col overflow-hidden"
           style="width:32px; background:var(--surface); border-left:1px solid var(--border); transition:width .2s ease;">

        <!-- Toggle tab -->
        <button onclick="reader.toggleVocab()"
                class="shrink-0 flex items-center justify-center transition active:opacity-50"
                style="height:44px; color:var(--muted); border-bottom:1px solid var(--border);"
                title="Vocabulaire">
            <i id="vocab-toggle-icon" class="fa-solid fa-bookmark text-xs"></i>
        </button>

        <!-- Contenu (masqué par défaut) -->
        <div id="vocab-content"
             class="flex flex-col gap-2.5 overflow-y-auto overflow-x-hidden"
             style="display:none; padding:0.625rem 0.625rem 0.75rem; width:148px;">

            <p class="text-[9px] font-bold uppercase tracking-widest" style="color:var(--accent);">
                Vocabulaire
            </p>

            <input id="vocab-fr" type="text" placeholder="Français…"
                   autocomplete="off" autocorrect="off" spellcheck="false"
                   class="vocab-inp">

            <input id="vocab-es" type="text" placeholder="Español…"
                   autocomplete="off" autocorrect="off" spellcheck="false"
                   class="vocab-inp">

            <button onclick="reader.saveVocab()"
                    class="w-full rounded-lg font-bold transition active:scale-95"
                    style="background:var(--accent); color:#12111a; padding:.5rem .25rem; font-size:11px; font-family:'Montserrat',sans-serif;">
                + Ajouter
            </button>

            <span id="vocab-saved"
                  class="hidden text-center font-bold"
                  style="color:#4ade80; font-size:10px;">✓ Sauvegardé</span>

        </div>

    </aside>

</div>

<!-- ═══════════════════════════════════════════════════════════════
     LOGIQUE
═══════════════════════════════════════════════════════════════ -->
<script>
const reader = {

    // ── Données du livre ─────────────────────────────────────────
    allBlocks: [],      // [{type:'h1'|'h2'|'sentence', text, paraIdx}]
    totalSentenceCount: 0,

    // ── Session ──────────────────────────────────────────────────
    contextBlocks: [],  // session précédente (atténuée)
    dayBlocks: [],      // session du jour
    dayEndIdx: 0,       // index suivant dans allBlocks
    wordsLoaded: 0,

    // ── Timer ─────────────────────────────────────────────────────
    startTime: null,
    timerInterval: null,

    // ── Config & progrès ─────────────────────────────────────────
    get cfg() {
        return JSON.parse(localStorage.getItem('acad2_config') || '{}');
    },
    get wordsPerDay() { return this.cfg.wordsPerDay || 300; },
    get prog() {
        return JSON.parse(localStorage.getItem('acad2_reader_progress') ||
            '{"blockIdx":0,"lastDate":null,"lastBlocks":[]}');
    },
    saveProg(data) {
        localStorage.setItem('acad2_reader_progress', JSON.stringify(data));
    },

    // ════════════════════════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════════════════════════
    async init() {
        await this.loadBook();
        this.buildSession();
        this.render();
        this.initScrollTitle();
        this.startTimer();

        document.getElementById('loader').classList.add('hidden');
        document.getElementById('reading-area').classList.remove('hidden');

        // Scroll to today's content immediately (no animation — instant positioning)
        const dayDiv = document.getElementById('day-content');
        if (dayDiv) {
            const main = document.getElementById('reader-main');
            main.scrollTop = dayDiv.offsetTop - main.offsetTop - 32;
        }

        ['vocab-fr','vocab-es'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => {
                if (e.key === 'Enter') reader.saveVocab();
            });
        });

        // Cover splash animation
        const splash      = document.getElementById('cover-splash');
        const coverScene  = document.getElementById('cover-scene');
        if (splash && coverScene) {
            // Spawn sparkles around the book
            const cx = 50, cy = 50, total = 28;
            for (let i = 0; i < total; i++) {
                const isStar = Math.random() > .48;
                const el     = document.createElement('div');
                el.className = 'sp ' + (isStar ? 'star' : 'dot');
                const angle  = (i / total) * 360 + Math.random() * 22;
                const rad    = angle * Math.PI / 180;
                const rx     = 11 + Math.random() * 17;   // horizontal spread %
                const ry     = 16 + Math.random() * 23;   // vertical spread %
                const size   = isStar ? 5 + Math.random() * 10 : 3 + Math.random() * 6;
                const dur    = (.65 + Math.random() * 1.5).toFixed(2);
                const dly    = (Math.random() * 2).toFixed(2);
                el.style.cssText =
                    `left:${(cx + Math.cos(rad) * rx).toFixed(1)}%;` +
                    `top:${(cy + Math.sin(rad) * ry).toFixed(1)}%;` +
                    `width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
                    `--spd:${dur}s;--dly:${dly}s;`;
                splash.appendChild(el);
            }

            coverScene.addEventListener('animationend', e => {
                if (e.animationName === 'coverAppear') {
                    setTimeout(() => coverScene.classList.add('zooming'), 375);
                } else if (e.animationName === 'coverZoom') {
                    splash.remove();
                    document.body.classList.add('reader-in');
                }
            });
        }

        // Surlignage
        document.addEventListener('mousedown', e => {
            if (!e.target.closest('#hl-bar')) reader.hideHlBar();
        });
        document.addEventListener('mouseup', e => {
            if (!e.target.closest('#hl-bar')) setTimeout(() => reader.checkSelection(), 0);
        });
        document.addEventListener('touchend', e => {
            if (!e.target.closest('#hl-bar')) setTimeout(() => reader.checkSelection(), 80);
        });
    },

    // ════════════════════════════════════════════════════════════
    //  LOAD CHAPITRES (fetch chapitres/0.txt, 1.txt, …)
    // ════════════════════════════════════════════════════════════
    async loadBook() {
        const base = location.protocol === 'file:'
            ? 'https://clement-torti.github.io/academie2/chapitres/'
            : 'chapitres/';
        let md = '';
        let i = 0;
        while (true) {
            let resp;
            try { resp = await fetch(`${base}${i}.txt`); }
            catch { break; }
            if (!resp.ok) break;
            const text = await resp.text();
            md += (md ? '\n\n' : '') + `## Chapitre ${i}\n\n` + text.trim();
            i++;
        }
        this.parseMarkdown(md);
    },

    // ════════════════════════════════════════════════════════════
    //  PARSE MARKDOWN → allBlocks
    // ════════════════════════════════════════════════════════════
    parseMarkdown(md) {
        const lines = md.split('\n');
        let paraIdx = 0;
        let pendingPara = '';

        const flushPara = () => {
            if (!pendingPara.trim()) return;
            this.splitSentences(pendingPara.trim()).forEach(s => {
                if (s.trim().length > 1) {
                    this.allBlocks.push({ type: 'sentence', text: s.trim(), paraIdx });
                }
            });
            paraIdx++;
            pendingPara = '';
        };

        for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line)          { flushPara(); continue; }
            if (line.startsWith('# '))  { flushPara(); this.allBlocks.push({ type:'h1', text:line.slice(2).trim(),  paraIdx:-1 }); }
            else if (line.startsWith('## ')) { flushPara(); this.allBlocks.push({ type:'h2', text:line.slice(3).trim(), paraIdx:-1 }); }
            else if (line === '---' || line === '***' || line === '___') { flushPara(); this.allBlocks.push({ type:'hr', paraIdx:-1 }); }
            else pendingPara += (pendingPara ? ' ' : '') + line;
        }
        flushPara();

        this.totalSentenceCount = this.allBlocks.filter(b => b.type === 'sentence').length;
    },

    updateChapterTitle() {
        const main = document.getElementById('reader-main');
        const h2s  = [...document.getElementById('reading-area').querySelectorAll('h2')];
        if (!h2s.length) return;
        const navH = document.querySelector('nav').offsetHeight;
        let current = h2s[0];
        for (const el of h2s) {
            if (el.getBoundingClientRect().top - navH <= 4) current = el;
        }
        document.getElementById('book-title').textContent = current.textContent;
    },

    initScrollTitle() {
        const main = document.getElementById('reader-main');
        main.addEventListener('scroll', () => this.updateChapterTitle(), { passive: true });
    },

    splitSentences(text) {
        // Découpe sur . ! ? … quand suivis d'un espace + majuscule, ou en fin de texte
        const result = [];
        let buf = '';
        for (let i = 0; i < text.length; i++) {
            buf += text[i];
            if ('.!?…'.includes(text[i])) {
                const next      = text[i + 1] ?? '';
                const afterSp   = text[i + 2] ?? '';
                const isEnd     = !next;
                const isBreak   = next === ' ' &&
                    afterSp !== '' &&
                    afterSp === afterSp.toUpperCase() &&
                    afterSp !== afterSp.toLowerCase();
                if (isEnd || isBreak) {
                    result.push(buf.trim());
                    buf = '';
                    if (next === ' ') i++;
                }
            }
        }
        if (buf.trim()) result.push(buf.trim());
        return result.filter(s => s.length > 1);
    },

    countWords(text) {
        return text.trim().split(/\s+/).filter(w => w.length > 0).length;
    },

    // ════════════════════════════════════════════════════════════
    //  BUILD SESSION
    // ════════════════════════════════════════════════════════════
    buildSession() {
        const prog = this.prog;
        const startIdx = prog.blockIdx || 0;

        this.contextBlocks = this.allBlocks.slice(0, startIdx);

        let idx = startIdx;
        let words = 0;
        this.dayBlocks = [];

        while (idx < this.allBlocks.length) {
            const b = this.allBlocks[idx];
            this.dayBlocks.push({ ...b, globalIdx: idx });
            if (b.type === 'sentence') {
                words += this.countWords(b.text);
                idx++;
                if (words >= this.wordsPerDay) break;
            } else {
                idx++;
            }
        }

        this.dayEndIdx  = idx;
        this.wordsLoaded = words;

        this.updateProgressBar();
    },

    // ════════════════════════════════════════════════════════════
    //  RENDER
    // ════════════════════════════════════════════════════════════
    render() {
        const area = document.getElementById('reading-area');
        let html = '';

        // Contexte session précédente
        if (this.contextBlocks.length > 0) {
            html += '<div class="ctx-block mb-10 pb-8" style="border-bottom:1px solid #1e1c2e;">';
            html += '<p class="no-ind text-center mb-6" style="font-family:Montserrat,sans-serif; font-size:.68rem; letter-spacing:.25em; text-transform:uppercase; color:#252234;">— session précédente —</p>';
            html += this.renderBlocks(this.contextBlocks);
            html += '</div>';
        }

        // Contenu du jour
        html += '<div id="day-content" class="fade-up">';
        html += this.renderBlocks(this.dayBlocks);
        html += '</div>';

        if (this.dayEndIdx >= this.allBlocks.length) {
            html += `<div class="text-center mt-16 mb-8" style="color:#2a2840; font-family:Montserrat,sans-serif;">
                <i class="fa-solid fa-scroll text-3xl mb-3 block"></i>
                <p style="font-size:.7rem; letter-spacing:.2em; text-transform:uppercase;">Fin du livre</p>
            </div>`;
        }

        // Boutons d'action intégrés au contenu
        html += `
<div id="end-actions" class="mt-12 pt-6 pb-4" style="border-top:1px solid var(--border);">
    <div class="flex justify-between items-center mb-4" style="color:var(--muted);">
        <span id="session-label" class="text-xs">${this.wordsLoaded} mots lus aujourd'hui</span>
        <span id="timer-label" class="text-xs font-mono"><i class="fa-regular fa-clock"></i> 0:00</span>
    </div>
    <div class="flex gap-2">
        <button id="btn-continue" onclick="reader.continueReading()"
                class="flex-1 py-3 rounded-xl text-sm font-bold transition active:scale-95"
                style="background:transparent; border:1px solid var(--border); color:var(--muted);">
            <i class="fa-solid fa-arrow-down mr-1 text-xs"></i> Lire plus
        </button>
        <button onclick="reader.finishReading()"
                class="flex-[2] py-3 rounded-xl text-sm font-bold transition active:scale-95"
                style="background:var(--accent); color:#12111a;">
            <i class="fa-solid fa-check mr-1 text-xs"></i> Terminer la lecture
        </button>
    </div>
</div>`;

        area.innerHTML = html;
        this.applyHighlightsToDOM(area);
    },

    renderBlocks(blocks) {
        let html = '';
        let curPara = -999;
        let buf = '';
        let firstOfSection = true;

        const flushP = () => {
            if (!buf) return;
            html += `<p class="${firstOfSection ? 'no-ind' : ''}">${buf}</p>`;
            buf = '';
            firstOfSection = false;
        };

        for (const b of blocks) {
            if (b.type === 'h1') {
                flushP();
                html += `<h1>${this.inline(b.text)}</h1>`;
                firstOfSection = true;
            } else if (b.type === 'h2') {
                flushP();
                html += `<h2>${this.inline(b.text)}</h2>`;
                firstOfSection = true;
            } else if (b.type === 'hr') {
                flushP();
                html += `<hr style="border:none;border-top:1px solid var(--border);margin:2em auto;width:40%;">`;
                firstOfSection = true;
            } else {
                if (b.paraIdx !== curPara) {
                    flushP();
                    curPara = b.paraIdx;
                }
                buf += (buf ? ' ' : '') + this.inline(b.text);
            }
        }
        flushP();
        return html;
    },

    inline(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g,     '<em>$1</em>')
            .replace(/_(.+?)_/g,       '<em>$1</em>');
    },

    // ════════════════════════════════════════════════════════════
    //  CONTINUE (+20 phrases)
    // ════════════════════════════════════════════════════════════
    continueReading() {
        let idx   = this.dayEndIdx;
        let added = 0;

        while (idx < this.allBlocks.length && added < 20) {
            const b = this.allBlocks[idx];
            this.dayBlocks.push({ ...b, globalIdx: idx });
            if (b.type === 'sentence') {
                this.wordsLoaded += this.countWords(b.text);
                added++;
            }
            idx++;
        }
        this.dayEndIdx = idx;

        const sl = document.getElementById('session-label');
        if (sl) sl.textContent = `${this.wordsLoaded} mots lus`;
        this.updateProgressBar();

        const dayDiv = document.getElementById('day-content');
        if (dayDiv) {
            dayDiv.innerHTML = this.renderBlocks(this.dayBlocks);
            this.applyHighlightsToDOM(dayDiv);
            setTimeout(() => {
                const main = document.getElementById('reader-main');
                main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
            }, 80);
        }

        if (this.dayEndIdx >= this.allBlocks.length) {
            const btn = document.getElementById('btn-continue');
            if (btn) { btn.disabled = true; btn.style.opacity = '.35'; btn.style.cursor = 'not-allowed'; }
        }
    },

    // ════════════════════════════════════════════════════════════
    //  TERMINER
    // ════════════════════════════════════════════════════════════
    finishReading() {
        this.stopTimer();

        const durationMs = this.startTime ? Date.now() - this.startTime : 0;
        const wpm = durationMs > 5000
            ? Math.round(this.wordsLoaded / (durationMs / 60000))
            : 0;
        const today = new Date().toISOString().split('T')[0];

        // Sauvegarder position
        this.saveProg({
            blockIdx:   this.dayEndIdx,
            lastDate:   today
        });

        // Stats
        const stats = JSON.parse(localStorage.getItem('acad2_stats') ||
            '{"sessions":[],"streak":0,"lastCompletedDate":null}');

        let session = stats.sessions.find(s => s.date === today);
        if (!session) {
            session = {
                date: today,
                readingWords: 0, readingDurationMs: 0, readingWpm: 0,
                translationSentences: 0, translationTimes: []
            };
            stats.sessions.push(session);
        }
        session.readingWords    = this.wordsLoaded;
        session.readingDurationMs = durationMs;
        session.readingWpm      = wpm;

        localStorage.setItem('acad2_stats', JSON.stringify(stats));
        window.location.href = 'translation.html';
    },

    // ════════════════════════════════════════════════════════════
    //  BARRE DE PROGRESSION
    // ════════════════════════════════════════════════════════════
    updateProgressBar() {
        if (!this.totalSentenceCount) return;
        const done = this.allBlocks
            .slice(0, this.dayEndIdx)
            .filter(b => b.type === 'sentence').length;
        const pct = Math.min(100, Math.round(done / this.totalSentenceCount * 100));
        document.getElementById('prog-label').textContent = `${pct}%`;
    },

    // ════════════════════════════════════════════════════════════
    //  TIMER
    // ════════════════════════════════════════════════════════════
    startTimer() {
        this.startTime = Date.now();
        this.timerInterval = setInterval(() => {
            const ms = Date.now() - this.startTime;
            const m  = Math.floor(ms / 60000);
            const s  = Math.floor((ms % 60000) / 1000);
            const el = document.getElementById('timer-label');
            if (el) el.innerHTML =
                `<i class="fa-regular fa-clock"></i> ${m}:${s.toString().padStart(2,'0')}`;
        }, 1000);
    },
    stopTimer() { if (this.timerInterval) clearInterval(this.timerInterval); },

    // ════════════════════════════════════════════════════════════
    //  SURLIGNAGE
    // ════════════════════════════════════════════════════════════
    get highlights() {
        return JSON.parse(localStorage.getItem('acad2_highlights') || '[]');
    },

    checkSelection() {
        const sel  = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        if (!text || text.length < 2) return;
        try {
            const range    = sel.getRangeAt(0);
            const readArea = document.getElementById('reading-area');
            if (!readArea || !readArea.contains(range.commonAncestorContainer)) return;
            const rect = range.getBoundingClientRect();
            const bar  = document.getElementById('hl-bar');
            bar.style.display = 'flex';
            bar.style.top  = `${rect.top - 44}px`;
            bar.style.left = `${rect.left + rect.width / 2}px`;
        } catch {}
    },

    hideHlBar() {
        document.getElementById('hl-bar').style.display = 'none';
    },

    applyHighlight() {
        const sel  = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        if (!text || text.length < 2) return;

        // Sauvegarde
        const hl = this.highlights;
        if (!hl.includes(text)) {
            hl.push(text);
            localStorage.setItem('acad2_highlights', JSON.stringify(hl));
        }

        // Marque visuelle immédiate
        try {
            const range = sel.getRangeAt(0);
            const mark  = document.createElement('mark');
            mark.className = 'hl';
            range.surroundContents(mark);
        } catch {
            // Si la sélection couvre plusieurs éléments, re-rendu avec highlights
            const dayDiv = document.getElementById('day-content');
            if (dayDiv) {
                dayDiv.innerHTML = this.renderBlocks(this.dayBlocks);
                this.applyHighlightsToDOM(dayDiv);
            }
        }
        sel.removeAllRanges();
        this.hideHlBar();
    },

    toggleVocab() {
        const aside   = document.getElementById('vocab-side');
        const content = document.getElementById('vocab-content');
        const icon    = document.getElementById('vocab-toggle-icon');
        const open    = content.style.display === 'none';
        aside.style.width        = open ? '148px' : '32px';
        content.style.display    = open ? 'flex'  : 'none';
        icon.className           = open
            ? 'fa-solid fa-chevron-right text-xs'
            : 'fa-solid fa-bookmark text-xs';
    },

    sendToVocab() {
        const sel  = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        this.hideHlBar();
        if (!text) return;
        // Ouvrir la sidebar si fermée
        const content = document.getElementById('vocab-content');
        if (content.style.display === 'none') this.toggleVocab();
        const inp = document.getElementById('vocab-fr');
        inp.value = text;
        document.getElementById('vocab-es').value = '';
        document.getElementById('vocab-es').focus();
    },

    removeHighlight() {
        const sel  = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        this.hideHlBar();
        if (!text) return;

        const hl = this.highlights.filter(h => h !== text);
        localStorage.setItem('acad2_highlights', JSON.stringify(hl));

        const dayDiv = document.getElementById('day-content');
        if (dayDiv) {
            dayDiv.innerHTML = this.renderBlocks(this.dayBlocks);
            this.applyHighlightsToDOM(dayDiv);
        }
        if (sel) sel.removeAllRanges();
    },

    applyHighlightsToDOM(container) {
        const highlights = this.highlights;
        for (const text of highlights) {
            this._markTextInNode(container, text);
        }
    },

    _markTextInNode(node, text) {
        if (node.nodeType === Node.TEXT_NODE) {
            const idx = node.textContent.indexOf(text);
            if (idx === -1) return;
            const mark   = document.createElement('mark');
            mark.className = 'hl';
            mark.textContent = text;
            const parent = node.parentNode;
            if (idx > 0) parent.insertBefore(document.createTextNode(node.textContent.slice(0, idx)), node);
            parent.insertBefore(mark, node);
            const after = node.textContent.slice(idx + text.length);
            if (after) parent.insertBefore(document.createTextNode(after), node);
            parent.removeChild(node);
        } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'MARK') {
            for (const child of [...node.childNodes]) {
                this._markTextInNode(child, text);
            }
        }
    },

    // ════════════════════════════════════════════════════════════
    //  VOCABULAIRE (sidebar inline)
    // ════════════════════════════════════════════════════════════
    saveVocab() {
        const fr = document.getElementById('vocab-fr').value.trim();
        const es = document.getElementById('vocab-es').value.trim();
        if (!fr || !es) return;

        const vocab = JSON.parse(localStorage.getItem('acad_user_vocab') || '[]');
        if (!vocab.find(v => v.fr.toLowerCase() === fr.toLowerCase())) {
            vocab.push({ fr, es });
            localStorage.setItem('acad_user_vocab', JSON.stringify(vocab));
        }
        document.getElementById('vocab-fr').value = '';
        document.getElementById('vocab-es').value = '';
        document.getElementById('vocab-fr').focus();

        const saved = document.getElementById('vocab-saved');
        saved.classList.remove('hidden');
        setTimeout(() => saved.classList.add('hidden'), 2000);
    }
};

reader.init();

// Ambient background sparkles — side margins only, never over the reading column
(function(){
    const N = 18;
    for (let i = 0; i < N; i++) {
        const el   = document.createElement('div');
        el.className = 'sp-bg ' + (Math.random() > .45 ? 'star' : 'dot');
        // concentrate in left (0-22%) and right (78-100%) dark margins
        const left = Math.random() > .5;
        const x    = left ? 1 + Math.random() * 21 : 77 + Math.random() * 21;
        const y    = 3 + Math.random() * 92;
        const size = 5 + Math.random() * 9;
        const dur  = (4.5 + Math.random() * 4.5).toFixed(2);
        const dly  = (Math.random() * 8).toFixed(2);
        el.style.cssText =
            `left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;` +
            `width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
            `--spd:${dur}s;--dly:${dly}s;`;
        document.body.appendChild(el);
    }
}());
</script>
